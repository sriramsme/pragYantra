[project]
name = "pragyantra"
version = "0.1.0"
description = "A modular foundation for an embodied assistant"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.35.1",
    "pillow>=13.0.0",
]

[project.scripts]
pragyantra = "pragyantra.cli:main"

[project.optional-dependencies]
webcam = [
    "opencv-python-headless>=5.0.0.93",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
src = ["src"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"

[dependency-groups]
dev = [
    "httpx2>=2.15.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
