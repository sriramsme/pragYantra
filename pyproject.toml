[project]
name = "pragyantra"
version = "0.1.0"
description = "A modular foundation for an embodied assistant"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
pragyantra = "pragyantra.cli:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
src = ["src"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
